<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f9be8">
<meta name="description" content="Plan your land, grow a village, lead your family. A cozy farm and village game that plays in the browser.">
<title>Farm Village</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./assets/game.css">
</head>
<body>
<div id="app"><div id="boot"><div class="logo" role="img" aria-label="Farm Village"><b>Farm</b><b>Village</b></div><div class="loading"><i></i><i></i><i></i></div></div></div>
<script>
// Stale-file guard (from Willowmere): if a deploy replaced the files this page needs, save and reload once.
(function () {
  var K = 'fv-fresh-reload', M = /dynamically imported module|Importing a module script failed|error loading dynamically imported module/i;
  window.__fvFresh = function () {
    try { if (Date.now() - (+sessionStorage.getItem(K) || 0) < 120000) return false; sessionStorage.setItem(K, String(Date.now())); } catch (e) {}
    try { window.__fvSave && window.__fvSave(); } catch (e) {}
    var u = new URL(location.href); u.searchParams.set('fresh', Date.now().toString(36)); location.replace(u.href); return true;
  };
  // Back after 30+ minutes hidden: reload if a newer release is live.
  var hidden = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hidden = Date.now(); return; }
    if (!hidden || Date.now() - hidden < 1800000) return; hidden = 0;
    var mine = (performance.getEntriesByType('resource').map(function (r) { return r.name; }).join(' ').match(/game\.js\?v=(\w+)/) || [])[1];
    if (!mine) return;
    fetch('./?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var live = (t.match(/game\.js\?v=(\w+)/) || [])[1];
      if (live && live !== mine) { try { sessionStorage.removeItem(K); } catch (e) {} window.__fvFresh(); }
    }).catch(function () {});
  });
  window.addEventListener('unhandledrejection', function (e) { if (M.test(String(e.reason && e.reason.message || e.reason))) window.__fvFresh(); });
})();
</script>
<script>
// The game could not start (a file failed twice): say so in both languages (the Vietnamese lines may not be loaded yet)
// and offer a reload, instead of leaving the splash up for ever.
window.__fvBootError = function () {
  var b = document.getElementById('boot'); if (!b || b.querySelector('.boot-error')) return;
  var vi = /^vi/.test((function () { try { return localStorage.getItem('farm-village.language') || ''; } catch (e) { return ''; } })() || navigator.language || '');
  var d = document.createElement('div'); d.className = 'boot-error';
  d.innerHTML = '<p>' + (vi ? 'Không tải được trò chơi. Hãy kiểm tra kết nối mạng.' : 'The farm could not load. Check your connection.') + '</p><button type="button">' + (vi ? 'Thử lại' : 'Try again') + '</button>';
  d.querySelector('button').onclick = function () { location.reload(); };
  var l = b.querySelector('.loading'); if (l) l.replaceWith(d); else b.appendChild(d);
};
</script>
<script type="module">import('./assets/game.js').catch(function (e) { console.error(e); if (!window.__fvFresh()) window.__fvBootError(); });</script>
</body>
</html>
